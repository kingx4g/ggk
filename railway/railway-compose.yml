# ⚠️ این فایل مخصوص Railway هست، نه برای docker compose معمولی.
# فقط این فایل رو (نه کل ریپو رو) از روی سیستمت بکش و روی صفحه‌ی پروژه‌ت
# توی داشبورد Railway رها کن (drag & drop) — همه‌ی ۴ سرویس با env varها،
# volumeها، و start commandهای درست، یکجا به‌عنوان "staged changes" ساخته میشن.
#
# پسورد دیتابیس، گواهی پنل، و API Key نود از قبل توی همین فایل ساخته و پر شدن —
# نیازی به دست‌زدن بهشون نیست (هرچند برای امنیت بیشتر می‌تونی بعداً عوضشون کنی).
# تنها چیزی که باید بعد از اولین دیپلوی پر کنی، گواهی خود سرویس node هست
# (چون فقط بعد از ساخته‌شدنش آدرس داخلیش مشخص میشه) — با راهنمای START-HERE
# یا README همین پوشه انجامش بده.

services:
  Postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pasarguard
      POSTGRES_USER: pasarguard
      POSTGRES_PASSWORD: 49fe6140b0f151457cc969c274004fae
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data

  panel:
    image: pasarguard/panel:latest
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://pasarguard:49fe6140b0f151457cc969c274004fae@${{Postgres.RAILWAY_PRIVATE_DOMAIN}}:5432/pasarguard
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
      UVICORN_SSL_CERTFILE: /var/lib/pasarguard/certs/ssl_cert.pem
      UVICORN_SSL_KEYFILE: /var/lib/pasarguard/certs/ssl_key.pem
      UVICORN_SSL_CA_TYPE: private
      ALLOWED_ORIGINS: "*"
      ENABLE_RECORDING_NODES_STATS: "True"
      PANEL_SSL_CERT_B64: 
      PANEL_SSL_KEY_B64: 
    volumes:
      - panel-data:/var/lib/pasarguard
    command: >
      sh -c "mkdir -p /var/lib/pasarguard/certs;
      echo \"$PANEL_SSL_CERT_B64\" | base64 -d > /var/lib/pasarguard/certs/ssl_cert.pem;
      echo \"$PANEL_SSL_KEY_B64\" | base64 -d > /var/lib/pasarguard/certs/ssl_key.pem;
      exec python main.py"

  proxy:
    image: caddy:2-alpine
    environment:
      PANEL_UPSTREAM: ${{panel.RAILWAY_PRIVATE_DOMAIN}}:8000
    ports:
      - "8080:8080"
    command: >
      sh -c "{ echo ':8080 {'; echo \"  reverse_proxy https://$PANEL_UPSTREAM {\";
      echo '    transport http {'; echo '      tls_insecure_skip_verify'; echo '    }';
      echo '  }'; echo '}'; } > /etc/caddy/Caddyfile;
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"

  node:
    image: pasarguard/node:latest
    environment:
      API_KEY: a27be619-0977-4673-899e-09fbad20e757
      NODE_HOST: 0.0.0.0
      SERVICE_PORT: 62050
      SSL_CERT_FILE: /var/lib/pg-node/certs/ssl_cert.pem
      SSL_KEY_FILE: /var/lib/pg-node/certs/ssl_key.pem
      # این دوتا رو فقط بعد از اینکه سرویس node ساخته شد و RAILWAY_PRIVATE_DOMAIN‌ش
      # رو از تب Variables دیدی، پر کن (توضیح کامل در README).
      SSL_CERT_B64: CHANGE_ME_AFTER_FIRST_DEPLOY
      SSL_KEY_B64: CHANGE_ME_AFTER_FIRST_DEPLOY
    volumes:
      - node-data:/var/lib/pg-node
    ports:
      - "8880:8880"
    command: >
      sh -c "mkdir -p /var/lib/pg-node/certs;
      echo \"$SSL_CERT_B64\" | base64 -d > /var/lib/pg-node/certs/ssl_cert.pem;
      echo \"$SSL_KEY_B64\" | base64 -d > /var/lib/pg-node/certs/ssl_key.pem;
      exec ./main"

volumes:
  postgres-data:
  panel-data:
  node-data:
